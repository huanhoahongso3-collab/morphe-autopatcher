name: Build patched apps + manager

on:
  schedule:
    - cron: "0 3 */2 * *"   # every 2 days
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild everything even if versions did not change"
        type: boolean
        default: false
      only:
        description: "Only build this app id (e.g. youtube); empty = all"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "scripts/**", "config/**", ".github/workflows/build.yml"]

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

      - name: Previous release
        run: |
          mkdir -p prev
          gh release download -R "$GITHUB_REPOSITORY" --dir prev --clobber || echo "no previous release"

      - name: Fetch tools
        run: |
          mkdir -p tools
          gh release download -R MorpheApp/morphe-desktop --pattern 'morphe-desktop-*-all.jar' --dir tools
          mv tools/morphe-desktop-*-all.jar tools/morphe.jar
          gh release download -R REAndroid/APKEditor --pattern 'APKEditor-*.jar' --dir tools
          mv tools/APKEditor-*.jar tools/apkeditor.jar
          gh release download -R kiber-io/apkdgo --pattern 'apkd-*-linux-amd64' --dir tools
          mv tools/apkd-*-linux-amd64 tools/apkd
          gh release download -R AzimsTech/apkmirror-downloader --pattern apkmd --dir tools
          gh release download -R EFForg/apkeep --pattern apkeep-x86_64-unknown-linux-gnu --dir tools
          mv tools/apkeep-x86_64-unknown-linux-gnu tools/apkeep
          chmod +x tools/apkd tools/apkmd tools/apkeep

      - name: Patch apps
        run: |
          IDS=$(jq -r '.apps[].id' config/apps.json)
          ONLY="${{ inputs.only }}"
          for id in $IDS; do
            [ -n "$ONLY" ] && [ "$ONLY" != "$id" ] && continue
            echo "::group::$id"
            python3 scripts/build_app.py --app "$id" --out "artifacts/app-$id" \
              --work "work/$id" --prev prev/versions.json \
              --cli tools/morphe.jar --editor tools/apkeditor.jar \
              --apkd tools/apkd --apkeep tools/apkeep --apkmd tools/apkmd \
              ${{ inputs.force && '--force' || '' }} || true
            cat "artifacts/app-$id/status.json" 2>/dev/null || true
            echo "::endgroup::"
          done

      - name: Decide manager build
        id: d
        run: |
          SHA=$(git log -1 --format=%H -- app build.gradle.kts settings.gradle.kts gradle.properties)
          PREV=$(jq -r '.manager.sourceSha // ""' prev/versions.json 2>/dev/null || true)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$SHA" != "$PREV" ] || [ "${{ inputs.force }}" = "true" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build manager
        if: steps.d.outputs.build == 'true'
        run: |
          gradle --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }}
          python3 scripts/manager_meta.py --out artifacts/manager \
            --apk app/build/outputs/apk/release/app-release.apk \
            --version-code ${{ github.run_number }} --version-name 1.0.${{ github.run_number }} \
            --source-sha ${{ steps.d.outputs.sha }}

      - name: Assemble release folder
        id: a
        run: python3 scripts/assemble.py

      - name: Publish release
        if: steps.a.outputs.changed == 'true'
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" release/* --latest --title "$TAG" \
            --notes "Auto-built. See versions.json for app + patch versions."
          # keep the 5 newest builds
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | tail -n +6 | \
            xargs -r -I{} gh release delete {} --cleanup-tag --yes
