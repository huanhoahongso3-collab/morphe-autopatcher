name: Build patched apps + manager

on:
  schedule:
    - cron: "0 3 */2 * *"   # every 2 days
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild everything even if versions did not change"
        type: boolean
        default: false
      only:
        description: "Only build this app id (e.g. youtube); empty = all"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties"]

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          only = "${{ inputs.only }}".strip()
          ids = [a["id"] for a in json.load(open("config/apps.json"))["apps"] if not only or a["id"] == only]
          print("matrix=" + json.dumps({"app": ids}))
          EOF

  build-app:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Previous release metadata
        run: |
          mkdir -p prev
          gh release download -R "$GITHUB_REPOSITORY" --pattern versions.json --dir prev || echo "no previous release"

      - name: Fetch tools (morphe CLI, APKEditor, downloaders)
        run: |
          mkdir -p tools
          gh release download -R MorpheApp/morphe-desktop --pattern 'morphe-desktop-*-all.jar' --dir tools
          mv tools/morphe-desktop-*-all.jar tools/morphe.jar
          gh release download -R REAndroid/APKEditor --pattern 'APKEditor-*.jar' --dir tools
          mv tools/APKEditor-*.jar tools/apkeditor.jar
          gh release download -R AzimsTech/apkmirror-downloader --pattern apkmd --dir tools
          gh release download -R nirewen/apkcombo-downloader --pattern apkcd-bun-linux-x64 --dir tools
          mv tools/apkcd-bun-linux-x64 tools/apkcd
          chmod +x tools/apkmd tools/apkcd

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Patch
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 scripts/build_app.py --app "${{ matrix.app }}" --out "out/app-${{ matrix.app }}" \
            --cli tools/morphe.jar --editor tools/apkeditor.jar \
            --apkmd tools/apkmd --apkcd tools/apkcd \
            ${{ inputs.force && '--force' || '' }}
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.app }}
          path: out/app-${{ matrix.app }}
          if-no-files-found: ignore

  build-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }

      - name: Previous release metadata
        run: |
          mkdir -p prev
          gh release download -R "$GITHUB_REPOSITORY" --pattern versions.json --dir prev || echo "no previous release"

      - name: Decide
        id: d
        run: |
          SHA=$(git log -1 --format=%H -- app build.gradle.kts settings.gradle.kts gradle.properties)
          PREV=$(python3 -c "import json,os;p='prev/versions.json';print((json.load(open(p)).get('manager') or {}).get('sourceSha','') if os.path.exists(p) else '')")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$SHA" != "$PREV" ] || [ "${{ inputs.force }}" = "true" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - name: Restore keystore
        if: steps.d.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build manager
        if: steps.d.outputs.build == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} \
            -PgithubRepo=${{ github.repository }}
          python3 scripts/manager_meta.py --out out/manager \
            --apk app/build/outputs/apk/release/app-release.apk \
            --version-code ${{ github.run_number }} --version-name 1.0.${{ github.run_number }} \
            --source-sha ${{ steps.d.outputs.sha }}

      - name: Mark skipped
        if: steps.d.outputs.build != 'true'
        run: python3 scripts/manager_meta.py --out out/manager --skipped --source-sha ${{ steps.d.outputs.sha }}

      - uses: actions/upload-artifact@v4
        with: { name: manager, path: out/manager }

  release:
    needs: [build-app, build-manager]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Previous release assets
        run: |
          mkdir -p prev
          gh release download -R "$GITHUB_REPOSITORY" --dir prev --clobber || echo "no previous release"

      - name: Assemble
        id: a
        run: python3 scripts/assemble.py

      - name: Publish release
        if: steps.a.outputs.changed == 'true'
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" release/* --latest --title "$TAG" \
            --notes "Auto-built. See versions.json for app + patch versions."
          # keep the 5 newest builds
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | tail -n +6 | \
            xargs -r -I{} gh release delete {} --cleanup-tag --yes
